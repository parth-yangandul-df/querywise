name: Deploy Backend to Lightsail

on:
  push:
    branches:
      - dev  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to Lightsail via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # 1. Navigate to project folder
            cd ~/sql-chat-app/backend

            # 2. Pull latest changes
            # Use -f to ignore local changes, but it won't touch your symlink
            git fetch --all
            git reset --hard origin/dev

            # 3. Ensure the symlink exists (Just in case)
            ln -sf ~/backend.env .env

            # 4. Activate Virtual Env and Update Dependencies
            source venv/bin/activate
            pip install --upgrade pip
            pip install . --force-reinstall

            # 5. Run Database Migrations
            export PYTHONPATH=$PYTHONPATH:$(pwd)
            alembic upgrade head

            # 6. Restart the Application
            pm2 restart sql-chat || pm2 start "venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port 8000" --name "sql-chat"
